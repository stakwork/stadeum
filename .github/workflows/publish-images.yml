name: publish images

# Builds stadeum's own images for amd64 and arm64 and pushes them to ghcr.io
# when what goes into one changes on main: ghcr.io/stakwork/stadeum-ui (ui/)
# and ghcr.io/stakwork/stadeum-ops (ops/, and the release it carries: stack/,
# .env.example, scripts/init-env.sh; ops/Dockerfile). Tags are the short
# commit sha, which is what a box pins, and the moving `latest`. A box
# follows `stable`, which moves only when someone runs promote-images.yml.
# An image whose sources did not change is not rebuilt, so it keeps its
# digest and ops does not restart it.
#
# Each platform builds on a runner of its own architecture and pushes by
# digest; `merge` then tags the two as one image. Under QEMU on one amd64
# runner, the arm64 half of stadeum-ui's `next build` took ten times as long.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "ops/**"
      - "stack/**"
      - ".env.example"
      - "scripts/init-env.sh"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  changes:
    # A manual dispatch from another branch would otherwise overwrite `latest`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.what.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What changed?
        id: what
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          every=""
          if [[ "$EVENT" != push || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            every=1
          fi
          build=()
          # Each image: its name, what its build sees, its Dockerfile, and
          # the paths that, changed, make a new one.
          while read -r name context file paths; do
            # shellcheck disable=SC2086 # paths is a list
            if [[ -n "$every" ]] || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $paths .github/workflows/publish-images.yml; then
              build+=("$(jq -cn --arg name "$name" --arg context "$context" --arg file "$file" '{$name, $context, $file}')")
            else
              echo "$paths did not change: no new $name"
            fi
          done <<'EOF'
          stadeum-ui  ui  ui/Dockerfile   ui
          stadeum-ops .   ops/Dockerfile  ops stack .env.example scripts/init-env.sh
          EOF
          images=$(printf '%s\n' "${build[@]}" | jq -cs 'map(select(. != null))')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "building: $images"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ghcr.io/stakwork/${{ matrix.image.name }}

      # Pushed by digest only: `merge` tags it once both platforms are in.
      # provenance/sbom off: a plain two-platform index, like strut's images.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/stakwork/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            STADEUM_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/stakwork/${{ matrix.image.name }}

      - name: Tag both platforms as one image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/stakwork/${{ matrix.image.name }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "::error::expected an amd64 and an arm64 digest, got ${digests[*]}"
            exit 1
          fi
          args=()
          while IFS= read -r a; do
            if [[ -n "$a" ]]; then args+=(--annotation "$a"); fi
          done <<< "$ANNOTATIONS"
          short=${GITHUB_SHA::7}
          docker buildx imagetools create "${args[@]}" -t "$IMAGE:$short" -t "$IMAGE:latest" \
            "$IMAGE@sha256:${digests[0]}" "$IMAGE@sha256:${digests[1]}"
          docker buildx imagetools inspect "$IMAGE:$short"
          digest=$(docker buildx imagetools inspect "$IMAGE:$short" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # gh attestation verify oci://ghcr.io/stakwork/<image>@sha256:<digest> --owner stakwork
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/stakwork/${{ matrix.image.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
