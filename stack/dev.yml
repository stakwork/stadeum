# Local overlay: plain http on HOST and strut.HOST, no certificates.
# Leave HOST at stadeum.localhost (.env.example): every *.localhost resolves
# to this machine, and with a dot in it strut.HOST stays the same site as
# HOST, which the strut frame's cookie needs (bare `localhost` and
# `strut.localhost` are two sites).
#
#   docker compose --env-file .env -f stack/stadeum.yml -f stack/dev.yml up -d --wait

services:
  caddy:
    environment:
      SCHEME: http
    ports: !override
      - "${HTTP_PORT:-80}:80"

  strut:
    environment:
      STRUT_PUBLIC_URL: http://strut.${HOST}

  # Built from this checkout. ops never pulls a service that has a build,
  # so locally it moves strut and strut-browser only, and an ops built here
  # has no releases: it never writes the stack files, which are the
  # checkout's.
  stadeum-ui:
    image: stadeum-ui:dev
    build: ../ui
    environment:
      AUTH_URL: http://${HOST}
      STRUT_PUBLIC_URL: http://strut.${HOST}
      # Password-less email sign-in, local only.
      STADEUM_DEV_LOGIN: "1"

  ops:
    image: stadeum-ops:dev
    # From the repository's root: the image carries the stack files (ops/Dockerfile).
    build:
      context: ..
      dockerfile: ops/Dockerfile
