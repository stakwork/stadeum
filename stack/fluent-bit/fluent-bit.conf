# Ships the containers' json-file logs to CloudWatch Logs
# (docs/stack-spec.md, "Logging"). Settings come from the environment
# (stack/stadeum.yml's fluent-bit service).

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

# Docker rotates these files; tail follows the new one. It starts at the end
# of each file, so a restart ships only what is logged from then on.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker
    Read_from_head    Off
    Refresh_Interval  10
    Skip_Long_Lines   On

# json-file adds the labels stack/stadeum.yml names as `attrs`: lift them to
# the top and rename them.
[FILTER]
    Name           nest
    Match          docker
    Operation      lift
    Nested_under   attrs

[FILTER]
    Name           modify
    Match          docker
    Rename         com.docker.compose.service service
    Rename         com.docker.compose.project project

# Not this container's own lines, or a failed send would be sent again.
[FILTER]
    Name           grep
    Match          docker
    Exclude        service ^fluent-bit$

[OUTPUT]
    Name                cloudwatch_logs
    Match               docker
    region              ${CLOUDWATCH_REGION}
    log_group_name      ${CLOUDWATCH_LOG_GROUP}
    log_stream_prefix   ${CLOUDWATCH_STREAM_PREFIX}
    log_stream_template ${CLOUDWATCH_STREAM_PREFIX}$service
    log_key             log
    auto_create_group   On
    log_retention_days  ${CLOUDWATCH_RETENTION_DAYS}
