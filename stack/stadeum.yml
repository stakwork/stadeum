# The stadeum stack. Service by service: docs/stack-spec.md.
#
#   scripts/init-env.sh                # once: generate .env
#   docker compose --env-file .env -f stack/stadeum.yml up -d --wait
#
# Local (plain http on *.localhost, no certificates): add `-f stack/dev.yml`.
#
# On a box these files are a release's: stadeum-ops's image carries them,
# and ops writes them in place when it applies the release (the Updates
# page). Do not edit them there: put the box's own changes in
# stack/local.yml, a compose override that ops and scripts/install.sh add
# when it is there (`-f stack/local.yml`, last) and ops never writes. .env
# is the box's too.
#
# Only caddy publishes host ports. The services reach each other by their
# service name on the project's network (`stadeum_default`).
#
# ops reads three labels (docs/stack-spec.md, "ops"):
#   stadeum.ops.update: <group>  ops moves the service on its channel, with
#                                the rest of its group. ops's own group is
#                                stadeum's release. No label: it moves when
#                                a release changes its pin.
#   stadeum.ops.backup: stop     stopped while the nightly snapshot is taken:
#                                its files would tear mid-write.
#   stadeum.ops.upgrade: confirm a release that changes its image waits
#                                until an admin confirms it on the Updates
#                                page, and ops backs up first.

name: stadeum

x-common: &common
  restart: unless-stopped

networks:
  # strut-browser's own network, which strut joins: a page the browser loads
  # can reach strut but nothing else in the stack.
  browser:

volumes:
  # Caddy's certificates and ACME account.
  caddy:
  neo4j:
  redis:
  bifrost:
  # strut's runs, chats, artifacts, apps and secret stores (sealed under
  # STRUT_SECRET_KEY). Workflows and steps live in Neo4j.
  strut-workspace:
  # strut's embedding and speech models (~500 MB), fetched on first use.
  # Not in the backup: a restored box fetches them again (AGENTS.md rule 8).
  strut-models:
  # Org macaroon signing key (stack/bootstrap/org-identity.mjs writes it,
  # stadeum-ui reads it). Contract: docs/mothership-spec.md.
  org:
  # stadeum-ui's SQLite database (people, invites, delegation state).
  stadeum-ui:
  # The treasury's account: its seed, made on the first start, and
  # wallet.jsonl, the payments it took. It is the money: lose it and every
  # snapshot of it, and the sats are gone.
  treasury:

services:
  caddy:
    <<: *common
    image: caddy:2.11.8-alpine
    environment:
      # The Caddyfile serves {SCHEME}://{HOST} and {SCHEME}://strut.{HOST}.
      # https fetches and renews the certificates itself.
      SCHEME: https
      HOST: ${HOST:?set HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    healthcheck:
      # The admin API answers on loopback only (127.0.0.1: `localhost` is
      # ::1 first, where it does not listen), once the config is loaded.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    <<: *common
    # The stock image strut's graph backend needs (fulltext and vector
    # indexes, 5.13+): no APOC, no GDS. Strut and bifrost make their own
    # indexes. PINNED, and held: Neo4j cannot open a store a newer version
    # wrote, so a release that moves it waits for an admin's confirmation
    # on the box, and ops backs up first.
    image: neo4j:5.26.32
    labels:
      stadeum.ops.backup: stop
      stadeum.ops.upgrade: confirm
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run scripts/init-env.sh}
      # Laptop defaults; raise them on a real box.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-1g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
      NEO4J_db_memory_transaction_total_max: ${NEO4J_TX_TOTAL_MAX:-1g}
      NEO4J_db_memory_transaction_max: ${NEO4J_TX_MAX:-512m}
    volumes:
      - neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    <<: *common
    image: redis:7.4.2-alpine
    labels:
      stadeum.ops.backup: stop
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bifrost:
    <<: *common
    # PINNED: the gateway moves with a stadeum release that changes this
    # pin (its version tags are stakgraph's releases). v0.4.399 is published
    # for amd64 and arm64, and has the runtime price table (`PUT
    # /_plugin/pricing`, since v0.4.398) stadeum-ui keeps Maple's, Numes'
    # and added providers' prices in (docs/models.md).
    image: ghcr.io/stakwork/stakgraph-gateway:${BIFROST_TAG:-v0.4.399}
    labels:
      stadeum.ops.backup: stop
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    # Internal only: strut and stadeum-ui call it on the network, and
    # nothing outside the box does.
    # Do NOT set APP_PORT/APP_HOST: the wrapper (PID 1) listens on 8181 and
    # runs bifrost-http on 127.0.0.1:8080.
    environment:
      BIFROST_ADMIN_USER: admin
      BIFROST_ADMIN_PASS: ${BIFROST_ADMIN_PASS:?run scripts/init-env.sh}
      BIFROST_PROVISIONING_TOKEN: ${SHARED_API_TOKEN:?run scripts/init-env.sh}
      BIFROST_PLUGIN_REDIS_URL: redis://redis:6379/0
      # Its agent catalog and evals, over Neo4j's HTTP Cypher endpoint.
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # No provider key comes from here. An admin sets each on stadeum's
      # Models page, which writes it to bifrost's config store (the bifrost
      # volume) and nowhere else: docs/models.md. Its baked config.json's
      # env.<NAME> slots stay empty until then.
      # Mandatory mothership: an inference call without a valid macaroon is
      # 401, and one over a macaroon/run cap is 402 (budgets only bite when
      # macaroons are enforced; gateway internal/auth/config.go). Hard-coded
      # so a stale .env cannot turn it off.
      BIFROST_PLUGIN_ENFORCE_MACAROONS: "true"
      BIFROST_PLUGIN_ENFORCE_BUDGETS: "true"
    volumes:
      - bifrost:/app/data
    # Healthcheck is baked into the image (wget :8181/health).

  maple:
    <<: *common
    # Maple's inference proxy (maple.ai): an OpenAI-compatible endpoint
    # that attests Maple's enclave and encrypts every request to it. The
    # gateway holds it as the custom provider `maple` once an admin sets
    # Maple's key on the Models page (docs/models.md); until then nothing
    # calls it. It reads each prompt in plaintext, so it stays on this
    # network: no port, no route in the Caddyfile. It holds no key: the
    # gateway sends Maple's on each request. No state, so no backup label;
    # PINNED (Maple's version tags are immutable, amd64 + arm64): it moves
    # with a stadeum release that changes this pin.
    image: ghcr.io/mapleprivacylabs/maple-proxy:${MAPLE_PROXY_TAG:-0.4.5}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      # It binds loopback unless told otherwise.
      MAPLE_HOST: 0.0.0.0
      MAPLE_PORT: "8080"
      # Nothing in a browser calls it; the image turns CORS on.
      MAPLE_ENABLE_CORS: "false"

  strut-browser:
    <<: *common
    # The Playwright server strut's browser steps drive; the builder looks
    # at the apps it makes through it. Its tag stays on strut's
    # playwright-core major.minor: the server refuses any other. strut's
    # promote workflow moves both `stable` tags together, and ops moves the
    # two containers together.
    image: ghcr.io/stakwork/strut-browser:${STRUT_BROWSER_TAG:-stable}
    labels:
      stadeum.ops.update: strut
    environment:
      # Its one door: a page it loads must not guess it.
      BROWSER_WS_PATH: ${BROWSER_WS_PATH:?run scripts/init-env.sh}
    networks: [browser]

  strut:
    <<: *common
    # The `stable` channel strut's promote workflow moves. A commit tag
    # (`2fe953a`) pins one; ops then has nothing to move until it changes.
    image: ghcr.io/stakwork/strut:${STRUT_IMAGE_TAG:-stable}
    labels:
      stadeum.ops.update: strut
      stadeum.ops.backup: stop
    depends_on:
      # bolt.verify() fails the boot when nothing is listening.
      neo4j: { condition: service_healthy }
      # Connected on a browser step's first page, not at boot.
      strut-browser: { condition: service_started }
    networks: [default, browser]
    environment:
      # Workflows and steps in Neo4j; runs, chats and secrets under
      # STRUT_WORKSPACE.
      STRUT_WORKSPACE_BACKEND: graph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      STRUT_WORKSPACE: /data/workspace
      STRUT_MODEL_DIR: /data/models
      BROWSER_WS_URL: ws://strut-browser:3000
      BROWSER_WS_PATH: ${BROWSER_WS_PATH}
      # The deployment key: every route needs it (or a session cookie). It
      # never reaches a browser; stadeum-ui trades it for a per-person
      # ticket.
      STRUT_API_KEY: ${SHARED_API_TOKEN}
      # Encrypts strut's secret stores (secrets.json, mothership.json).
      # Losing it loses what they hold.
      STRUT_SECRET_KEY: ${STRUT_SECRET_KEY:?run scripts/init-env.sh}
      # Every model call goes through bifrost on the caller's delegation,
      # which stadeum-ui pushes to /llm/delegations. A call with nobody to
      # bill is an error, never a direct provider call: strut holds no
      # provider key. Hard-coded like bifrost's flags.
      STRUT_MOTHERSHIP: "1"
      STRUT_MOTHERSHIP_REQUIRED: "1"
      STRUT_PUBLIC_URL: https://strut.${HOST}
      # Optional: web search when a call is routed through the gateway.
      EXA_API_KEY: ${EXA_API_KEY:-}
      # The org's model (docs/models.md). Strut's shipped workflows (job,
      # orchestrator, builder) pin none of their own (strut/host-config.json),
      # so they run on STRUT_DEFAULT_MODEL, which stadeum-ui keeps in strut's
      # settings from the Models page. This value is only what strut uses
      # until stadeum-ui first sets it.
      STRUT_HOST_CONFIG: /config/host-config.json
      STRUT_DEFAULT_MODEL: anthropic/claude-sonnet-5-5
      # Calls: strut hands each person's call (`POST /voice/calls`) to the
      # voice service, with the secret the two share. Set only when calls
      # can work (LiveKit's keys and the token in .env); unset, strut
      # answers that no voice service is configured, and the Calls page
      # says so.
      STRUT_VOICE_URL: ${LIVEKIT_API_KEY:+${LIVEKIT_API_SECRET:+${STRUT_VOICE_TOKEN:+http://voice:8080}}}
      STRUT_VOICE_TOKEN: ${STRUT_VOICE_TOKEN:-}
      # Packages strut installs at first boot, when they are not installed
      # yet (strut's STRUT_PACKAGES). Empty: none.
      STRUT_PACKAGES: ${STRUT_PACKAGES:-}
      # The wallet strut sells paid public runs through, and an admin
      # withdraws from: the treasury, below. Set only when .env has the
      # treasury's three tokens (scripts/init-env.sh, which install.sh
      # runs); unset, strut has no wallet and sells nothing. Strut keeps
      # them in its encrypted payments.json and hides them from steps, but a
      # shell in this container can still read the pay token and spend the
      # treasury's balance: a risk accepted on purpose (plans/treasury.md
      # §2).
      LIGHTNING_DAEMON_URL: ${DAEMON_ADMIN_TOKEN:+${DAEMON_RECEIVE_TOKEN:+${DAEMON_PAY_TOKEN:+http://treasury:8095}}}
      LIGHTNING_DAEMON_TOKEN: ${DAEMON_ADMIN_TOKEN:+${DAEMON_PAY_TOKEN:+${DAEMON_RECEIVE_TOKEN:-}}}
      LIGHTNING_DAEMON_PAY_TOKEN: ${DAEMON_ADMIN_TOKEN:+${DAEMON_RECEIVE_TOKEN:+${DAEMON_PAY_TOKEN:-}}}
    volumes:
      - strut-workspace:/data/workspace
      - strut-models:/data/models
      - ./strut/host-config.json:/config/host-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      # First boot seeds the schema and ontology and fetches the embedding
      # model before it listens.
      start_period: 180s

  voice:
    <<: *common
    # sphinx-voice's 1:1 mode (stakwork/sphinx-voice): a person's voice call
    # with the assistant, from the Calls page. strut hands it each call with
    # the person and STRUT_VOICE_TOKEN; it names a fresh room on LiveKit,
    # mints the person's token for it, joins it itself end-to-end encrypted
    # with the key the person's browser made, and runs each turn through
    # strut as the person (the orchestrator, and speech on strut's
    # /audio/transcribe and /audio/speak). LiveKit is reached outbound
    # only: no port, no route in the Caddyfile. No state.
    # The `stable` channel sphinx-voice's promote workflow moves to one of
    # its releases (Docker Hub; `scripts/promote.sh voice`). It speaks
    # strut's turn and call contracts, so ops moves it in strut's group: one
    # drain, one health check, one rollback. A release's tag (`0.43`) pins
    # one; ops then has nothing to move until it changes.
    image: sphinxlightning/sphinx-voice:${VOICE_TAG:-stable}
    labels:
      stadeum.ops.update: strut
    depends_on:
      strut: { condition: service_healthy }
    # tini as PID 1, so a stop reaches node (or the sleep below) at once.
    init: true
    environment:
      STRUT_URL: http://strut:3000
      STRUT_API_KEY: ${SHARED_API_TOKEN}
      STRUT_VOICE_TOKEN: ${STRUT_VOICE_TOKEN:-}
      # It binds loopback unless told otherwise; strut calls it, and posts
      # a turn's end back, at http://voice:8080.
      LISTEN_HOST: 0.0.0.0
      PORT: "8080"
      CALLBACK_URL_BASE: http://voice:8080
      # Any LiveKit server; the default is the central one.
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://livekit.sphinx.chat}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    # The 1:1 mode, not the image's default (meeting Jamie). Without
    # LiveKit's keys or the token it refuses to start, so it waits instead,
    # and the box comes up with calls off (strut has no STRUT_VOICE_URL).
    command:
      - sh
      - -c
      - >-
        if [ -z "$$LIVEKIT_API_KEY" ] || [ -z "$$LIVEKIT_API_SECRET" ] || [ -z "$$STRUT_VOICE_TOKEN" ]; then
        echo "[voice] calls are off: set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env; for STRUT_VOICE_TOKEN, run the installer again (scripts/install.sh)";
        exec sleep infinity; fi;
        exec node dist/one-to-one.js

  # The treasury (plans/treasury.md): a Sphinx daemon (stakwork/sphinx
  # wasm/daemon) on an account of its own, the Lightning wallet strut sells
  # through. Strut alone calls it, with the receive token (invoices, the
  # balance) and the pay token (a withdrawal). The admin token, which could
  # post and join tribes as the account, is in this container alone. It
  # answers nobody and joins no tribe: it connects out to its LSP only
  # (the image's default broker), so no port and no route in the Caddyfile.
  # The `stable` channel stakwork/sphinx's promote-daemon.yml moves
  # (scripts/promote.sh daemon). It speaks strut's wallet contract, so ops
  # moves it in strut's group, as voice. A commit tag (`b31014c`) pins one.
  # One container per account: a second daemon on the same seed, on
  # another box, knocks this one off the broker.
  treasury:
    <<: *common
    image: ghcr.io/stakwork/sphinx-daemon:${TREASURY_TAG:-stable}
    labels:
      stadeum.ops.update: strut
      # wallet.jsonl is appended as payments settle.
      stadeum.ops.backup: stop
    # tini as PID 1, so a stop reaches node (or the sleep below) at once.
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    environment:
      DAEMON_ADMIN_TOKEN: ${DAEMON_ADMIN_TOKEN:-}
      DAEMON_RECEIVE_TOKEN: ${DAEMON_RECEIVE_TOKEN:-}
      DAEMON_PAY_TOKEN: ${DAEMON_PAY_TOKEN:-}
      DAEMON_ALIAS: treasury
      # No service: it answers no mention and joins no tribe.
      DAEMON_REPLY: none
      SPHINX_HOME: /data
      DAEMON_HOST: 0.0.0.0
      DAEMON_PORT: "8095"
    volumes:
      - treasury:/data
    # Without its three tokens it waits instead of making an account
    # nothing uses, and the box runs without a wallet (strut has no
    # LIGHTNING_DAEMON_URL).
    command:
      - sh
      - -c
      - >-
        if [ -z "$$DAEMON_ADMIN_TOKEN" ] || [ -z "$$DAEMON_RECEIVE_TOKEN" ] || [ -z "$$DAEMON_PAY_TOKEN" ]; then
        echo "[treasury] no wallet: run the installer again (scripts/install.sh), which adds the DAEMON_*_TOKENs to .env and starts it";
        exec sleep infinity; fi;
        exec node build/daemon/src/index.js
    healthcheck:
      # Healthy once it listens (GET /health, no token), or at once while it
      # waits for its tokens.
      test: ["CMD", "node", "-e", "const e = process.env; if (!e.DAEMON_ADMIN_TOKEN || !e.DAEMON_RECEIVE_TOKEN || !e.DAEMON_PAY_TOKEN) process.exit(0); fetch('http://127.0.0.1:8095/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # One-shot: org signing key + bifrost trust registration. Idempotent;
  # re-run with `docker compose ... run --rm bootstrap`. An update never
  # starts it (`restart: "no"`).
  bootstrap:
    image: node:22.20.0-alpine
    restart: "no"
    depends_on:
      bifrost: { condition: service_healthy }
    environment:
      BIFROST_URL: http://bifrost:8181
      SHARED_API_TOKEN: ${SHARED_API_TOKEN}
      STADEUM_ENCRYPTION_KEY: ${STADEUM_ENCRYPTION_KEY:?run scripts/init-env.sh}
      STADEUM_ORG_SLUG: ${STADEUM_ORG_SLUG:-org}
      STADEUM_ISSUER_URL: ${STADEUM_ISSUER_URL:-}
      STADEUM_ORG_KEY_FILE: /org/org-key.json
    volumes:
      - ./bootstrap:/bootstrap:ro
      - org:/org
    command: ["node", "/bootstrap/org-identity.mjs"]

  stadeum-ui:
    <<: *common
    # stadeum's own image, published from main (.github/workflows); `stable`
    # moves when someone promotes a commit. stack/dev.yml builds it here.
    image: ghcr.io/stakwork/stadeum-ui:${STADEUM_IMAGE_TAG:-stable}
    labels:
      stadeum.ops.update: stadeum
      stadeum.ops.backup: stop
    depends_on:
      strut: { condition: service_healthy }
      bifrost: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    environment:
      PORT: "3000"
      DATABASE_URL: file:/data/stadeum.db
      STRUT_URL: http://strut:3000
      # Where the browser loads strut's UI from: same site as AUTH_URL, so
      # strut's session cookie reaches the frame.
      STRUT_PUBLIC_URL: https://strut.${HOST}
      BIFROST_URL: http://bifrost:8181
      BIFROST_ADMIN_USER: admin
      BIFROST_ADMIN_PASS: ${BIFROST_ADMIN_PASS}
      NEO4J_HTTP_URL: http://neo4j:7474
      SHARED_API_TOKEN: ${SHARED_API_TOKEN}
      # Sign-in. AUTH_URL is stadeum-ui's public origin.
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${HOST}
      AUTH_TRUST_HOST: "true"
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      STADEUM_DEV_LOGIN: ${STADEUM_DEV_LOGIN:-}
      STADEUM_ALLOWED_DOMAINS: ${STADEUM_ALLOWED_DOMAINS:-}
      STADEUM_ADMIN_EMAIL: ${STADEUM_ADMIN_EMAIL:-}
      # Model providers the box's host gives (docs/models.md): stadeum-ui
      # alone holds them, and writes them to the gateway.
      STADEUM_MODEL_PROVIDERS: ${STADEUM_MODEL_PROVIDERS:-}
      STADEUM_ORG_NAME: ${STADEUM_ORG_NAME:-}
      # Org identity written by `bootstrap` (docs/mothership-spec.md).
      STADEUM_ORG_SLUG: ${STADEUM_ORG_SLUG:-org}
      STADEUM_ENCRYPTION_KEY: ${STADEUM_ENCRYPTION_KEY}
      STADEUM_ORG_KEY_FILE: /org/org-key.json
    volumes:
      - org:/org:ro
      - stadeum-ui:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # The box's upkeep: updates and backups (docs/stack-spec.md, "ops").
  # The Docker socket is mounted here and nowhere else, and ops has no port:
  # it reads its settings from stadeum-ui, drains strut, and posts back
  # what it did. Its image is stadeum's release: with stadeum-ui's, and the
  # stack files it carries, it moves on stadeum's channel, applied by the
  # new ops itself.
  ops:
    <<: *common
    image: ghcr.io/stakwork/stadeum-ops:${STADEUM_IMAGE_TAG:-stable}
    labels:
      stadeum.ops.update: stadeum
    environment:
      SHARED_API_TOKEN: ${SHARED_API_TOKEN}
      STRUT_URL: http://strut:3000
      STADEUM_UI_URL: http://stadeum-ui:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The box's directory: the stack files ops runs compose with and
      # writes from each release, and the .env it keeps in each snapshot and
      # puts back on a restore. ops links its host path to here, so compose
      # hands the daemon host paths.
      - ..:/stadeum
      # A local backup destination: the box's backups/ (testing, or a disk
      # mounted there). Not off the box.
      - ../backups:/backups
      # Every volume, for the snapshot and the restore, but strut-models:
      # models are fetched again, not kept.
      - caddy:/volumes/caddy
      - neo4j:/volumes/neo4j
      - redis:/volumes/redis
      - bifrost:/volumes/bifrost
      - strut-workspace:/volumes/strut-workspace
      - org:/volumes/org
      - stadeum-ui:/volumes/stadeum-ui
      - treasury:/volumes/treasury
    healthcheck:
      # No port to probe: the loop writes a heartbeat every 15 s.
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
